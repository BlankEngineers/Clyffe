<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tesla 1.1 — Blank Engineers | ARC III Ecosystem</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --border: #243044;
      --text: #e6edf3;
      --muted: #8b9bb4;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.14);
      --user-bg: #1c283a;
      --bot-bg: #101722;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand h1 { margin: 0; font-size: 1.05rem; letter-spacing: 0.02em; }
    .brand p { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
    .controls { display: flex; align-items: center; gap: 10px; }
    select, button {
      background: #1a2333;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #06131f;
      border-color: var(--accent);
      font-weight: 600;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      overflow: hidden;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { display: none; }
    }
    aside {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 16px;
      overflow-y: auto;
      font-size: 0.82rem;
    }
    aside h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin: 0 0 10px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(36, 48, 68, 0.5);
    }
    .meta-row span:first-child { color: var(--muted); }
    .meta-row span:last-child { text-align: right; font-family: monospace; word-break: break-all; }
    .quick-prompts { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
    .quick-prompts button { text-align: left; font-size: 0.8rem; background: var(--bot-bg); }
    .quick-prompts button:hover { border-color: var(--accent); }
    .chat-area {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      line-height: 1.45;
      font-size: 0.92rem;
    }
    .msg.user { align-self: flex-end; background: var(--user-bg); }
    .msg.bot { align-self: flex-start; background: var(--bot-bg); }
    .msg .meta { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    form.composer {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.92rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Tesla 1.1 — Blank Engineers</h1>
      <p>ARC III Ecosystem | Native LittleBit-2 Experimental Language Model (Offline Packed Runtime)</p>
    </div>
    <div class="controls">
      <label for="ckpt-select" style="font-size:0.82rem;color:var(--muted);">Checkpoint:</label>
      <select id="ckpt-select"></select>
    </div>
  </header>

  <main>
    <aside>
      <h2>Model Metadata</h2>
      <div id="metadata-panel">Loading metadata...</div>

      <h2 style="margin-top:18px;">Sample Prompts</h2>
      <div class="quick-prompts">
        <button onclick="sendQuick('Who are you?')">Who are you?</button>
        <button onclick="sendQuick('What is gravity?')">What is gravity?</button>
        <button onclick="sendQuick('What is an atom?')">What is an atom?</button>
        <button onclick="sendQuick('My name is Hari.')">My name is Hari.</button>
        <button onclick="sendQuick('What is my name?')">What is my name?</button>
        <button onclick="sendQuick('What is your model specifications?')">Model specifications</button>
        <button onclick="sendQuick('25 + 35')">25 + 35</button>
        <button onclick="sendQuick('What is the stock price of Apple today?')">Out-of-scope test</button>
      </div>
    </aside>

    <section class="chat-area">
      <div id="messages">
        <div class="msg bot">
          ARC-LB-01 offline runtime ready. All inference runs locally using packed LittleBit-2 binary latent factors.
        </div>
      </div>
      <form class="composer" onsubmit="handleSubmit(event)">
        <input id="prompt-input" type="text" placeholder="Ask ARC-LB-01 (greetings, identity, science, general facts, or math)..." autocomplete="off" />
        <button type="submit" class="primary">Send</button>
      </form>
    </section>
  </main>

  <script>
    const ckptSelect = document.getElementById("ckpt-select");
    const metaPanel = document.getElementById("metadata-panel");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("prompt-input");

    function renderMetadata(md) {
      const rows = [
        ["Name", md.name],
        ["Organization", md.organization],
        ["Architecture", md.architecture],
        ["Dense Equiv Params", md.parameter_count_dense_equiv],
        ["LittleBit Coverage", md.littlebit_coverage_pct + "%"],
        ["Effective BPW", md.overall_effective_bpw],
        ["Vocab Size", md.vocab_size],
        ["Context Length", md.context_length],
        ["Checkpoint", md.checkpoint_identifier],
        ["Raw Bits Size", md.theoretical_raw_bytes + " bytes"],
        ["Tensor Payload", md.actual_tensor_payload_bytes + " bytes"],
        ["Disk .pt Size", md.actual_storage_bytes + " bytes"],
        ["SHA-256", (md.checkpoint_sha256 || "").slice(0, 16) + "..."]
      ];
      metaPanel.innerHTML = rows.map(([k, v]) =>
        `<div class="meta-row"><span>${k}</span><span>${v}</span></div>`
      ).join("");
    }

    async function loadStatus() {
      const res = await fetch("/api/status");
      const data = await res.json();
      ckptSelect.innerHTML = data.available_checkpoints.map(c =>
        `<option value="${c}" ${c === data.active_checkpoint ? "selected" : ""}>${c}</option>`
      ).join("");
      renderMetadata(data.metadata);
    }

    ckptSelect.addEventListener("change", async () => {
      const res = await fetch("/api/switch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ checkpoint: ckptSelect.value })
      });
      const data = await res.json();
      renderMetadata(data.metadata);
      appendMsg("bot", `Switched checkpoint to ${data.active_checkpoint}.`);
    });

    function appendMsg(role, text, meta = "") {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendPrompt(text) {
      if (!text.trim()) return;
      appendMsg("user", text);
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: text })
      });
      const data = await res.json();
      appendMsg("bot", data.response, `${data.latency_ms} ms | ${data.checkpoint}`);
    }

    function sendQuick(text) {
      sendPrompt(text);
    }

    function handleSubmit(e) {
      e.preventDefault();
      const text = inputEl.value;
      inputEl.value = "";
      sendPrompt(text);
    }

    loadStatus();
  </script>
</body>
</html>
